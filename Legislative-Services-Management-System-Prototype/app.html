<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Session and Legislative Meeting Management System — scheduling, agenda preparation, attendance & quorum monitoring, proceedings documentation, minutes generation, and real-time session tracking." />
  <title>SLMMS — Session and Legislative Meeting Management System</title>

  <!-- Preconnect to CDNs for faster loading -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Precompiled Tailwind CSS (static, no runtime CDN compiler) -->
  <link rel="stylesheet" href="css/tailwind.css" />

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>

  <!-- Custom styles -->
  <link rel="stylesheet" href="css/styles.css" />
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100">

  <!-- ===================== LOADING SCREEN ===================== -->
  <div id="ls-loading-screen">
    <div class="ls-loader-ring mb-6"></div>
    <h1 class="text-white text-xl font-bold tracking-wide">Legislative Services Management System</h1>
    <p id="ls-loading-text" class="text-blue-100 text-sm mt-2">Loading core libraries…</p>
  </div>

  <!-- Inline fail-safe: hide loader fast even if module/CDN is slow -->
  <script>
    (function () {
      var steps = ['Loading core libraries…', 'Preparing legislative workspace…', 'Almost ready…'];
      var i = 0, txt = document.getElementById('ls-loading-text');
      var iv = setInterval(function () {
        if (txt && i < steps.length - 1) { i++; txt.textContent = steps[i]; }
      }, 900);
      // Hard cap: never show the loader for more than 5 seconds total.
      setTimeout(function () {
        clearInterval(iv);
        var l = document.getElementById('ls-loading-screen');
        if (l && l.style.display !== 'none') {
          l.style.transition = 'opacity .35s ease';
          l.style.opacity = '0';
          setTimeout(function () { l.style.display = 'none'; }, 360);
        }
      }, 5000);
      window.__lsLoaderInterval = iv;
    })();
  </script>

  <!-- ===================== TOAST CONTAINER ===================== -->
  <div id="ls-toast-container"></div>

  <!-- ===================== MODAL ROOT ===================== -->
  <div id="ls-modal-root"></div>

  <!-- ===================== MOBILE BACKDROP ===================== -->
  <div id="ls-mobile-backdrop" class="fixed inset-0 bg-slate-900/50 z-30 hidden lg:hidden"></div>

  <!-- ===================== APP SHELL ===================== -->
  <div class="flex min-h-screen">

    <!-- ============ SIDEBAR ============ -->
    <aside id="ls-sidebar" class="fixed lg:sticky top-0 left-0 z-40 h-screen w-64 shrink-0 -translate-x-full lg:translate-x-0 bg-slate-900 text-slate-300 shadow-sidebar flex flex-col">
      <!-- Brand -->
      <div class="h-16 flex items-center gap-3 px-5 border-b border-slate-800">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center shadow-lg">
          <i data-lucide="landmark" class="w-5 h-5 text-white"></i>
        </div>
        <div class="leading-tight">
          <p class="text-white font-bold text-sm tracking-wide">SLMMS</p>
          <p class="text-slate-400 text-[10px] uppercase tracking-wider">Session Management</p>
        </div>
      </div>

      <!-- Nav -->
      <nav id="ls-nav" class="flex-1 overflow-y-auto no-scrollbar py-3 px-2 space-y-0.5 text-sm"></nav>

      <!-- Footer -->
      <div class="p-3 border-t border-slate-800">
        <div class="flex items-center gap-3 p-2 rounded-xl hover:bg-slate-800 transition cursor-pointer" onclick="location.hash='#/settings'">
          <div class="w-9 h-9 rounded-full bg-gradient-to-br from-emerald-500 to-emerald-700 flex items-center justify-center text-white font-semibold text-sm">RA</div>
          <div class="leading-tight flex-1 min-w-0">
            <p class="text-white text-sm font-medium truncate">Hon. R. Almazan</p>
            <p class="text-slate-400 text-[11px] truncate">City Secretary</p>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-slate-500"></i>
        </div>
      </div>
    </aside>

    <!-- ============ MAIN COLUMN ============ -->
    <div class="flex-1 min-w-0 flex flex-col">

      <!-- ============ TOP BAR ============ -->
      <header id="ls-topbar" class="sticky top-0 z-20 h-16 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b border-slate-200 dark:border-slate-800 flex items-center gap-3 px-4 lg:px-6">
        <button id="ls-menu-btn" class="lg:hidden p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800" aria-label="Toggle menu">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>

        <!-- Breadcrumb -->
        <nav id="ls-breadcrumb" class="hidden md:flex items-center gap-1.5 text-sm text-slate-500 dark:text-slate-400 min-w-0"></nav>

        <!-- Search -->
        <div class="flex-1 max-w-md mx-auto md:mx-0 md:ml-auto relative">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input id="ls-global-search" type="text" placeholder="Search sessions, agenda, members…"
            class="w-full pl-9 pr-3 py-2 text-sm rounded-xl bg-slate-100 dark:bg-slate-800 border border-transparent focus:border-primary-400 focus:bg-white dark:focus:bg-slate-800 outline-none transition" />
          <div id="ls-search-results" class="hidden absolute left-0 right-0 mt-2 bg-white dark:bg-slate-800 rounded-xl shadow-xl border border-slate-200 dark:border-slate-700 max-h-80 overflow-y-auto z-30"></div>
        </div>

        <!-- Dark mode -->
        <button id="ls-dark-toggle" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 ls-focus" data-ls-tooltip="Toggle dark mode" aria-label="Toggle dark mode">
          <i data-lucide="moon" class="w-5 h-5"></i>
        </button>

        <!-- Notifications -->
        <button id="ls-notif-btn" class="relative p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 ls-focus" data-ls-tooltip="Notifications" aria-label="Notifications">
          <i data-lucide="bell" class="w-5 h-5"></i>
          <span id="ls-notif-dot" class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full ls-pulse-dot"></span>
        </button>

        <!-- Quick add -->
        <button onclick="location.hash='#/scheduling'" class="hidden sm:flex items-center gap-2 px-3 py-2 rounded-xl bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium transition ls-focus">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span class="hidden lg:inline">Quick Action</span>
        </button>
      </header>

      <!-- Notification dropdown -->
      <div id="ls-notif-panel" class="hidden fixed top-16 right-4 z-30 w-80 bg-white dark:bg-slate-800 rounded-xl shadow-xl border border-slate-200 dark:border-slate-700 overflow-hidden"></div>

      <!-- ============ CONTENT ============ -->
      <main id="ls-main" class="flex-1 p-4 lg:p-6 max-w-[1600px] w-full mx-auto"></main>

      <!-- ============ FOOTER ============ -->
      <footer class="border-t border-slate-200 dark:border-slate-800 px-6 py-4 text-xs text-slate-500 dark:text-slate-400 flex flex-col sm:flex-row items-center justify-between gap-2">
        <p>© 2024 Legislative Services Management System — Capstone Prototype. Front-end only, Local Storage powered.</p>
        <p class="flex items-center gap-1.5"><i data-lucide="shield-check" class="w-3.5 h-3.5"></i> For demonstration purposes only</p>
      </footer>
    </div>
  </div>

  <!-- ===================== APP MODULES ===================== -->
  <!-- Bundled JS (no ES6 modules) — works when opened directly via file:// without a server -->
  <script src="js/app.bundle.js"></script>
</body>
</html>
